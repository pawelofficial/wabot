# Exercise catalog: fixed IDs every exercise is stored under, so the same exercise keeps one ID
# however the trainee or trainer names it. Training plans (plans/*.yaml) are built from these IDs,
# and the LLM sees the name and aliases of the exercises in the trainee's plan. IDs are permanent
# once data uses them – add new entries instead of renaming. `aliases` are other names people
# use (the code also matches them for exercises outside the plan). Loaded once at startup by
# wabot/exercises.py.

- id: back_squat
  name: Przysiad ze sztangą
  aliases: [przysiad, przysiady, siady, squat, back squat]
  group: nogi

