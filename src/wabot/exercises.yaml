# Exercise catalog: fixed IDs the LLM maps every reported and planned exercise to, so the same
# exercise is stored under one ID however the trainee or trainer names it. IDs are permanent
# once data uses them – add new entries instead of renaming. `aliases` are other names people
# use; the LLM also matches obvious variants. Loaded once at startup by wabot/exercises.py.

- id: back_squat
  name: Przysiad ze sztangą
  aliases: [przysiad, przysiady, squat, back squat]
  group: nogi

