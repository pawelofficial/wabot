[project]
name = "wabot"
version = "0.1.0"
description = "WhatsApp assistant for personal trainers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "google-auth[requests]>=2.62.1",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openai>=3.42.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wabot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wabot"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
